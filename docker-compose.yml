name: devtiro-build-task-app   # Name of the overall project
services:                      # Define services (containers) here
  ui:                          # Service name: "ui"
    image: ghcr.io/devtiro/devtiro-build-task-app:latest   # Docker image to use
    ports:
      - "3000:3000"            # Maps container port 3000 → localhost:3000
    environment:               # Environment variables passed to the container
      - BACKEND_HOST=host.docker.internal   # Points to backend service
      - BACKEND_PORT=8080
    extra_hosts:               # For Linux compatibility
      - "host.docker.internal:host-gateway"